name: Host checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Unit tests, lint and debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # CLI 23 reads repository schema 3, which publishes Android platform 37.0.
      # The action accepts the Android SDK licenses for the installed packages.
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Prepare pinned Tencent JNI runtime
        shell: bash
        run: python3 tools/android/prepare-tencent-native.py

      - name: Prepare verified Sherpa runtime
        shell: bash
        run: bash ./gradlew :engine-sherpa:prepareSherpaArchive --no-daemon --console=plain

      - name: Prepare pinned Sherpa native toolchains
        shell: bash
        run: |
          set -euo pipefail
          tools_root="$RUNNER_TEMP/sherpa-tools"
          mkdir -p "$tools_root"
          python3 - <<'PY' > "$RUNNER_TEMP/sherpa-tool-pins.tsv"
          import json
          from pathlib import Path
          manifest = json.loads(Path("engine-sherpa/native-build.json").read_text())
          for name, tool in manifest["tools"].items():
              print("\t".join((name, tool["url"], tool["archiveSha256"], tool["directory"])))
          PY
          while IFS=$'\t' read -r name url digest directory; do
            archive="$tools_root/$name.archive"
            curl --fail --location --proto '=https' --proto-redir '=https' "$url" --output "$archive"
            printf '%s  %s\n' "$digest" "$archive" | sha256sum --check
            case "$name" in
              ndk) unzip -q "$archive" -d "$tools_root" ;;
              cmake) tar -xzf "$archive" -C "$tools_root" ;;
              ninja) mkdir "$tools_root/$directory"; unzip -q "$archive" -d "$tools_root/$directory" ;;
              *) echo "Unsupported pinned native tool: $name" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/sherpa-tool-pins.tsv"

      - name: Prepare pinned paired Sherpa runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/android/prepare-sherpa-native.py \
            --tools-root "$RUNNER_TEMP/sherpa-tools" \
            --source-cache "$RUNNER_TEMP/sherpa-sources" \
            --output engine-sherpa/.native-cache/android \
            --abis arm64-v8a x86_64 --download
          python3 tools/android/prepare-sherpa-native.py --verify \
            --output engine-sherpa/.native-cache/android --abis arm64-v8a x86_64

      - name: Test paired Sherpa preparation boundaries
        shell: bash
        run: python3 -m unittest discover -s tools/android -p 'test_prepare_sherpa_native.py'

      - name: Run application host checks
        shell: bash
        run: >-
          bash ./gradlew
          :core:testDebugUnitTest
          :engine-mlkit:testDebugUnitTest
          :engine-tencent:testDebugUnitTest
          :engine-sherpa:testDebugUnitTest
          :speech-models:testDebugUnitTest
          :app:testDebugUnitTest
          :translator-test-kit:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleDebugAndroidTest
          --no-daemon --console=plain

      - name: Test build logic
        shell: bash
        run: bash ./gradlew -p build-logic test --no-daemon --console=plain

      - name: Retain host reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-reports-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            core/build/test-results/testDebugUnitTest/
            engine-mlkit/build/test-results/testDebugUnitTest/
            engine-tencent/build/test-results/testDebugUnitTest/
            engine-sherpa/build/test-results/testDebugUnitTest/
            speech-models/build/test-results/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            translator-test-kit/build/test-results/testDebugUnitTest/
            build-logic/build/test-results/test/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
